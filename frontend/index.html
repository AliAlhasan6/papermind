<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperMind</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body>

<header>
  <h1>PaperMind</h1>
  <span class="tag">local · ollama · qwen 2.5 · chroma · networkx</span>
</header>

<main>
  <aside class="panel left">
    <section class="block">
      <h2>Library</h2>
      <div id="upload-zone">
        <input type="file" id="pdf-input" multiple accept=".pdf" />
        <label for="pdf-input" class="btn">+ Add PDFs</label>
        <button id="ingest-btn" class="btn primary" disabled>Ingest</button>
      </div>
      <div id="ingest-status"></div>
      <ul id="paper-list"></ul>
    </section>

    <section class="block">
      <h2>Knowledge graph</h2>
      <div id="kg-viewer"></div>
      <div id="kg-caption"></div>
    </section>
  </aside>

  <section class="panel center">
    <div id="messages">
      <div class="placeholder">
        Ask a question about your papers.<br/>
        <small>Local inference — answers take a few minutes.</small>
      </div>
    </div>
    <form id="chat-form">
      <input type="text" id="chat-input" placeholder="Ask a question about your papers..." autocomplete="off" />
      <button type="submit" id="send-btn" class="btn primary">Send</button>
    </form>
  </section>

  <aside class="panel right">
    <section class="block">
      <h2>Sources</h2>
      <div id="sources-list"><em>Citations appear here after an answer.</em></div>
    </section>
    <section class="block">
      <h2>Agent trace</h2>
      <div id="tools-list"><em>Tool calls shown here.</em></div>
    </section>
  </aside>
</main>

<script src="/app.js"></script>
</body>
</html>
